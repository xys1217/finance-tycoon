name: 每日 A 股交易信号

# ---------------------------------------------------------------------------
# 为什么需要它
#
# 沙箱里的平台定时任务实测跑不通：任务状态被更新成「已执行」，
# 但脚本跑在与本沙箱隔离的环境里（那里没有 /workspace），
# 于是没有产物、没有日志、也不报错 —— 静默失败，最危险的一种。
#
# GitHub Actions 的 runner 也是隔离环境，但它先 checkout 代码，
# 所以 /home/runner/work/... 下面真的有仓库，脚本能跑。
#
# 时区换算（GitHub cron 一律 UTC，北京 = UTC+8）：
#   北京 周一~周五 06:00  →  UTC 周日~周四 22:00  →  '0 22 * * 0-4'
#   北京 周一~周五 07:00  →  UTC 周日~周四 23:00  →  '0 23 * * 0-4'
#   北京 周一~周五 08:30  →  UTC 周一~周五 00:30  →  '30 0 * * 1-5'
#                            ↑ 这里 UTC 仍是「前一天」，所以周几写 0-4 才对
#
# 为什么排三次：GitHub 官方明确说 schedule 事件在高峰期会延迟，
# 只排 08:30 一次的话，延迟 1 小时就错过开盘了。
# 三次分别在 06:00 / 07:00 / 08:30，任一一次成功即可；
# 后两次若发现当天信号已生成会直接命中缓存跳过，成本极低。
# ---------------------------------------------------------------------------
on:
  schedule:
    - cron: '0 22 * * 0-4'          # 北京 周一~周五 06:00
    - cron: '0 23 * * 0-4'          # 北京 周一~周五 07:00
    - cron: '30 0 * * 0-4'          # 北京 周一~周五 08:30
  workflow_dispatch:                 # 允许在网页上手动点一次（排障/补跑用）

permissions:
  contents: write                    # 需要把生成结果 commit 回仓库

concurrency:
  group: daily-signal
  cancel-in-progress: false          # 三次触发排队执行，不互相取消

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40              # 缓存全 miss 时拉 641 只 K 线可能十几分钟，40 分钟保险

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 装依赖
        # 只装信号生成需要的包。
        # flask / playwright 是本地 server 与测试用的，CI 里不需要。
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 恢复 K 线缓存
        # 关键：data/kline_cache 被 .gitignore 排除，每次 checkout 都是空的。
        # 没有这步，每天都要重新拉 641 只股票的全量日线（境外网络下可能十几分钟甚至超时）。
        # 有缓存时脚本只拉增量，通常几十秒。
        uses: actions/cache@v4
        with:
          path: data/kline_cache
          # run_number 单调递增，保证每次都能存下一份新缓存；
          # restore-keys 回退到最近的一份。GitHub 按 LRU 清理，10GB 限额够用很久。
          key: kline-cache-${{ github.run_number }}
          restore-keys: |
            kline-cache-

      - name: 数据源连通性自检
        # 关键步骤：runner 在境外，访问东方财富/新浪/腾讯可能受限或被限流。
        # 不先验证就跑，等于每天早上安静地失败一次——任务还是绿的，
        # 但信号永远是昨天的。这一步不可跳过。
        id: probe
        continue-on-error: true
        run: |
          python tools/check_datasource.py

      - name: 连通性失败就明确炸出来
        if: steps.probe.outcome == 'failure'
        run: |
          echo "::error::行情数据源在此网络环境下不可用，信号生成必然失败。"
          echo "::error::GitHub Actions 的 runner 在境外，国内行情接口常被限流或拒绝。"
          echo "::error::三个出路：1) 换国内服务器挂 cron；2) 挂自托管 runner；3) 手动跑。"
          echo "::error::不要相信这个任务的绿色状态——先打开 Pages 页面看信号日期。"
          exit 1

      - name: 如果当天信号已生成就跳过
        # 06:00 那次成功后，07:00 / 08:30 这两次没必要重跑。
        # 判据用 sig_date（信号日期）而不是文件 mtime。
        id: fresh
        run: |
          TODAY="$(TZ=Asia/Shanghai date '+%Y-%m-%d')"
          GOT=""
          if [ -f web/api/daily_signal.json ]; then
            GOT="$(python -c "import json;print(json.load(open('web/api/daily_signal.json')).get('sig_date',''))" 2>/dev/null || true)"
          fi
          echo "北京今日 $TODAY ｜ 仓库内信号日 ${GOT:-无}"
          if [ "$GOT" = "$TODAY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::当日信号已存在（$TODAY），跳过生成。"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 生成当日信号并刷新离线版
        if: steps.fresh.outputs.skip != 'true'
        run: |
          bash web/run_daily_signal.sh

      - name: 断言信号是新鲜的
        # 防静默失败的最后一道闸。
        # 「任务绿了但信号是昨天的」正是本地定时任务踩过的坑：
        # 状态显示已执行、时间也前进，就是没有产物。
        # 检查逻辑放在 tools/check_signal_fresh.py，不内联在 workflow 里 ——
        # 内联的 heredoc 没法单独跑、没法喂坏数据做负向测试。
        run: |
          python tools/check_signal_fresh.py web/api/daily_signal.json

      - name: 部署到 GitHub Pages 目录
        # 把离线版拷到 docs/，Pages 指向 /docs 后，
        # 打开 https://<用户名>.github.io/<仓库名>/ 就是当日信号，
        # 不用下载、不用起 server。
        run: |
          mkdir -p docs
          cp web/index_static.html docs/index.html
          cp web/api/daily_signal.json docs/daily_signal.json
          ls -la docs/

      - name: 写运行摘要
        if: always()
        run: |
          {
            echo "## 每日信号 · 北京时间 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            echo
            if [ -f web/api/daily_signal.json ]; then
              python - <<'PY'
          import json
          d = json.load(open("web/api/daily_signal.json"))
          f, rb, ch, s = d["data_freshness"], d["rebalance"], d["changes"], d["summary"]
          print(f"- 信号日 **{d['sig_date']}** ｜ 因子基准 bar_date **{d['bar_date']}**")
          print(f"- 数据新鲜度：stale={f['stale']} ｜ bars_behind={f['bars_behind']}")
          print(f"- 动作：**{ch['action']}**")
          print(f"- 下次个股调仓：**{rb['next_stock_rebalance']}**")
          print(f"- 投入 {s['invested']:,.0f} 元（{s['invested_pct']}%）"
                f"｜ 现金 {s['cash']:,.0f} 元（{s['cash_pct']}%）")
          sl = [x for x in d.get("stop_loss_scan", []) if x.get("hit_stop")]
          if sl:
              print()
              print("### ⚠ 触发止损")
              for x in sl:
                  print(f"- {x['code']} {x.get('name','')} 浮亏 {x.get('pnl_pct')}%")
          PY
            else
              echo "信号文件未生成，查看上一步日志"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 提交产物
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -f 是必须的：web/api/*.json 被 .gitignore 排除（只有 positions.json 例外），
          # 但 daily_signal.json 必须进仓库，否则下次跑算不出「新进/调出」差异。
          git add -A daily/ docs/
          git add -f web/api/daily_signal.json
          if git diff --cached --quiet; then
            echo "无变化（非交易日或信号未变）"
          else
            git commit -m "每日信号 $(TZ=Asia/Shanghai date '+%Y-%m-%d')"
            git push
          fi
